name: 週次 分析・ブラッシュアップ（PDCA）

on:
  schedule:
    # 毎週月曜 日本時間 7:00（UTC 22:00 日曜）
    - cron: "0 22 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt

      - name: insights を取得して分析・学習
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/analyze.py

      - name: 結果をコミット
        run: |
          git config user.name instapost-bot
          git config user.email instapost-bot@users.noreply.github.com
          git add state docs/report.json content/generated.json 2>/dev/null || true
          git diff --cached --quiet && echo "変更なし" && exit 0
          git commit -m "週次分析 $(date -u +%Y-%m-%d)"
          git pull --rebase && git push
