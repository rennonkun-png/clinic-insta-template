name: 競合アカウントの比較

on:
  schedule:
    # 毎週日曜 日本時間 22:00（UTC 13:00）。月曜 2:00 のネタづくりが、最新の競合を見られるように
    - cron: "0 13 * * 0"
  workflow_dispatch:
    inputs:
      check:
        description: "試しに読むアカウント・ハッシュタグ（スペース区切り。タグは # を付ける）。空なら設定どおりに記録"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt

      - name: 競合の公開情報を読む（自社の Instagram 接続を使う。外部サービスは使わない）
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          CHECK: ${{ inputs.check }}
        run: |
          if [ -n "$CHECK" ]; then python scripts/competitors.py --check $CHECK; else python scripts/competitors.py; fi

      - name: 結果を保存
        if: ${{ inputs.check == '' }}
        run: |
          git config user.name instapost-bot
          git config user.email instapost-bot@users.noreply.github.com
          for f in state/competitors.json state/competitors_report.md state/competitor_pool.json state/hashtag_top.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet && echo "変更なし" && exit 0
          git commit -m "競合の比較 $(date -u +%Y-%m-%d)"
          git pull --rebase && git push
